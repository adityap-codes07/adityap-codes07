name: Generate Premium Profile Visuals

on:
  schedule:
    - cron: "0 18 * * *" # Runs every day
  workflow_dispatch: # Allows manual trigger anytime
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 1: Generate Premium Snake Grid with Cyberpunk Theme
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: adityap-codes07
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=fuchsia&color_dots=#161b22,#7928ca,#ff0080,#ff4500,#00df89
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=cyan&color_dots=#161b22,#0d2b45,#203c56,#546a7b,#00df89

      # Step 2: Generate 3D Isometric Profile Graph
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: adityap-codes07

      # Step 3: Push Snake Animation SVGs to the `output` branch
      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Commit and Push the 3D Graph Assets directly back to main branch
      - name: Push 3D Assets to main branch
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-3d-contrib/
          git commit -m "Generated Premium 3D Profile Graph" || exit 0
          git push origin main
